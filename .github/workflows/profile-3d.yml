name: GitHub 3D Contribution City Night View

on:
  schedule:
    # Runs everyday at 18:00 UTC (23:30 IST)
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Calendar
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate 3D Profile Contributions
        uses: yoshi389111/github-profile-3d-contrib@0.7.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and Push 3D City SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --staged --quiet || git commit -m "chore(3d-contrib): refresh 3D night-view contribution city [skip ci]"
          git push

